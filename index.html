
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Typing Academy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Daily Typing Academy</h1>
    <p class="subtitle">Improve Your English Typing Skills</p>

    <div class="settings">
      <label for="difficulty">Select Level:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>

    <div class="stats">
      <div class="stat">
        <span>Time</span>
        <strong id="timer">60</strong>
      </div>
      <div class="stat">
        <span>WPM</span>
        <strong id="wpm">0</strong>
      </div>
      <div class="stat">
        <span>CPM</span>
        <strong id="cpm">0</strong>
      </div>
      <div class="stat">
        <span>Accuracy</span>
        <strong id="accuracy">100%</strong>
      </div>
      <div class="stat">
        <span>Errors</span>
        <strong id="errors">0</strong>
      </div>
    </div>

    <div id="passage" class="passage"></div>

    <textarea id="typingInput"
      placeholder="Start typing here..."
      disabled></textarea>

    <button id="restartBtn">Start / Restart Test</button>

    <h2 id="result"></h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
