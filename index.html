<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Typing Academy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="typing-app">
    <h1>Daily Typing Academy</h1>
    <h2>Improve Your English Typing Skills</h2>

    <div class="levels">
      <button class="level-btn" data-level="easy">Easy</button>
      <button class="level-btn" data-level="medium">Medium</button>
      <button class="level-btn" data-level="hard">Hard</button>
    </div>

    <p id="passage">The quick brown fox jumps over the lazy dog.</p>

    <textarea id="typing" placeholder="Start typing here..." disabled></textarea>

    <div class="stats">
      <p>Time: <span id="time">60</span></p>
      <p>WPM: <span id="wpm">0</span></p>
      <p>Accuracy: <span id="accuracy">100%</span></p>
    </div>

    <button id="start">Start Test</button>
    <button id="restart">Restart</button>

    <div class="final-result">
      <h2>Your Result</h2>
      <p>WPM: <span id="final-wpm">0</span></p>
      <p>Accuracy: <span id="final-accuracy">0%</span></p>
      <p id="performance">Good luck!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
